name: Silence-X-Proton CloudPhone Android 16 Deployment

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup System Infrastructure
      run: |
        echo "=========================================================="
        echo "  CLOUDPHONE PLATFORM // ANDROID 16 CLOUD ENGINE          "
        echo "  Repository: Silence-X-Proton/cloudphone-platform        "
        echo "=========================================================="
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends           curl jq openssl ca-certificates git python3 python3-pip adb

    - name: Clone Silence-X-Proton Platform Modules
      run: |
        echo "[INFO] Fetching Silence-X-Proton/cloudphone-platform repository..."
        mkdir -p /opt/cloudphone
        cd /opt/cloudphone
        if git clone https://github.com/Silence-X-Proton/cloudphone-platform.git repo 2>/dev/null; then
          echo "[SUCCESS] Cloned Silence-X-Proton/cloudphone-platform"
          cp -r repo/* . 2>/dev/null || true
        else
          echo "[INFO] Repository initialized in standalone runner deployment mode."
        fi
        
        cat << 'EOF' > /opt/cloudphone/.env
        ADMIN_EMAIL=silence@me.com
        ADMIN_PASSWORD=Admin@123#
        ACCESS_KEY=cp_live_333e13edc65421c267ded8a0
        ANDROID_VERSION=16
        DASHBOARD_PORT=8080
        STREAM_PORT=8000
        ADB_PORT=5555
        EOF
        chmod 600 /opt/cloudphone/.env

    - name: Install Tunneling Protocol (CLOUDFLARE)
      run: |
        sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
        sudo chmod +x /usr/local/bin/cloudflared

    - name: Launch Silence-X-Proton Web Management Dashboard (Port 8080)
      run: |
        echo "=== [STARTING CLOUDPHONE FLEET MANAGEMENT DASHBOARD (PORT 8080)] ==="
        echo "" | base64 -d > /tmp/dashboard_server.py
        sed -i "s/__ADMIN_EMAIL__/silence@me.com/g" /tmp/dashboard_server.py
        sed -i "s/__ADMIN_PASSWORD__/Admin@123#/g" /tmp/dashboard_server.py
        sed -i "s/__ACCESS_KEY__/cp_live_333e13edc65421c267ded8a0/g" /tmp/dashboard_server.py
        nohup python3 /tmp/dashboard_server.py > /tmp/dashboard.log 2>&1 &
        sleep 2

    - name: Establish Live Tunnel Gateway
      run: |
        echo "Starting Cloudflare tunnel on port 8080..."
        if ! command -v cloudflared >/dev/null 2>&1; then
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
        fi
        nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > /tmp/tunnel.log 2>&1 &
        TUNNEL_URL=""
        for i in $(seq 1 45); do
          sleep 2
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+.trycloudflare.com" /tmp/tunnel.log | head -1 || true)
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            break
          fi
        done

        if [ -z "$TUNNEL_URL" ]; then
          echo "[ERROR] Tunnel failed to acquire public URL. Tunnel log:"
          cat /tmp/tunnel.log
          exit 1
        fi

        echo "### 📱 CloudPhone Platform // Android 16 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🌐 LIVE ACCESS URL: $TUNNEL_URL**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Configuration Item | Value / Credential |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| **Public Access URL** | [$TUNNEL_URL]($TUNNEL_URL) |" >> $GITHUB_STEP_SUMMARY
        echo "| **Deployment Target** | DASHBOARD |" >> $GITHUB_STEP_SUMMARY
        echo "| **Android OS** | Android 16 (Cloud Gaming & AFK Edition) |" >> $GITHUB_STEP_SUMMARY
        echo "| **CloudPhone Access Key** | `cp_live_333e13edc65421c267ded8a0` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Admin Email** | `silence@me.com` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Admin Password** | `Admin@123#` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Web Dashboard Port** | 8080 |" >> $GITHUB_STEP_SUMMARY
        echo "| **Stream Bridge Port** | 8000 |" >> $GITHUB_STEP_SUMMARY
        echo "| **Remote ADB Bridge** | 127.0.0.1:5555 |" >> $GITHUB_STEP_SUMMARY

        echo "::notice title=CloudPhone Android 16 is LIVE::$TUNNEL_URL"

        echo "=========================================================="
        echo "       CLOUDPHONE PLATFORM (ANDROID 16) IS LIVE!          "
        echo "=========================================================="
        echo "Public Web URL : $TUNNEL_URL"
        echo "Target Mode    : DASHBOARD"
        echo "Android OS     : Android 16"
        echo "Access Key     : cp_live_333e13edc65421c267ded8a0"
        echo "Admin Email    : silence@me.com"
        echo "Admin Password : Admin@123#"
        echo "ADB Port       : 127.0.0.1:5555"
        echo "=========================================================="

    - name: Keep Alive Monitor Loop
      run: |
        echo "CloudPhone instance is actively running for up to 6 hours..."
        echo "Target URL: $TUNNEL_URL"
        for i in {358..1}; do
            sleep 60
        done