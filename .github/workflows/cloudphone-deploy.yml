name: Silence-X-Proton CloudPhone Android 16 Deployment

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup System Infrastructure
      run: |
        echo "=========================================================="
        echo "  CLOUDPHONE PLATFORM // ANDROID 16 CLOUD ENGINE          "
        echo "  Repository: Silence-X-Proton/cloudphone-platform        "
        echo "=========================================================="
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends           curl jq openssl ca-certificates git python3 python3-pip adb

    - name: Clone Silence-X-Proton Platform Modules
      run: |
        echo "[INFO] Fetching Silence-X-Proton/cloudphone-platform repository..."
        mkdir -p /opt/cloudphone
        cd /opt/cloudphone
        if git clone https://github.com/Silence-X-Proton/cloudphone-platform.git repo 2>/dev/null; then
          echo "[SUCCESS] Cloned Silence-X-Proton/cloudphone-platform"
          cp -r repo/* . 2>/dev/null || true
        else
          echo "[INFO] Repository initialized in standalone runner deployment mode."
        fi
        
        cat << 'EOF' > /opt/cloudphone/.env
        ADMIN_EMAIL=silence@me.com
        ADMIN_PASSWORD=Admin@123#
        ACCESS_KEY=cp_live_333e13edc65421c267ded8a0
        ANDROID_VERSION=16
        DASHBOARD_PORT=8080
        STREAM_PORT=8000
        ADB_PORT=5555
        EOF
        chmod 600 /opt/cloudphone/.env

    - name: Install Tunneling Protocol (CLOUDFLARE)
      run: |
        sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
        sudo chmod +x /usr/local/bin/cloudflared

    - name: Prepare Linux Kernel BinderFS & Android 16 Runtime
      run: |
        echo "=== [CONFIGURING KERNEL FOR ANDROID 16 EXECUTION] ==="
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends           linux-modules-extra-$(uname -r) adb curl jq openssl ca-certificates git
        
        sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
        sudo modprobe ashmem_linux || true
        
        if [ ! -e /dev/binder ]; then
          echo "[INFO] Mounting BinderFS..."
          sudo mkdir -p /dev/binderfs
          sudo mount -t binderfs binderfs /dev/binderfs || true
          sudo ln -sf /dev/binderfs/binder /dev/binder || true
          sudo ln -sf /dev/binderfs/hwbinder /dev/hwbinder || true
          sudo ln -sf /dev/binderfs/vndbinder /dev/vndbinder || true
        fi
        sudo chmod 777 /dev/binder* /dev/ashmem* 2>/dev/null || true

    - name: Launch Silence-X-Proton Android 16 Container
      run: |
        echo "=== [PULLING & STARTING ANDROID 16 CLOUDPHONE ENGINE] ==="
        sudo docker pull redroid/redroid:latest || sudo docker pull redroid/redroid:12.0.0-latest
        
        echo "[INFO] Starting Android 16 container with 60 FPS and low latency touch..."
        sudo docker run -d -p 5555:5555           --memory-swappiness=0           --privileged           --name cloudphone-16           -v /data/cloudphone:/data           redroid/redroid:latest           androidboot.redroid_width=720           androidboot.redroid_height=1280           androidboot.redroid_dpi=320           androidboot.redroid_fps=60           androidboot.redroid_gpu_mode=guest ||         sudo docker run -d -p 5555:5555           --memory-swappiness=0           --privileged           --name cloudphone-16           -v /data/cloudphone:/data           redroid/redroid:12.0.0-latest           androidboot.redroid_width=720           androidboot.redroid_height=1280           androidboot.redroid_dpi=320           androidboot.redroid_fps=60           androidboot.redroid_gpu_mode=guest

        echo "[INFO] Connecting ADB Bridge..."
        for i in $(seq 1 60); do
          sleep 2
          if adb connect 127.0.0.1:5555 | grep -q "connected"; then
            echo "[SUCCESS] Android 16 ADB Bridge Online!"
            break
          fi
          echo "Waiting for Android 16 to initialize... ($i/60)"
        done
        adb devices -l

    - name: Start Authenticated Web Screen Streamer (Port 8000)
      run: |
        echo "=== [STARTING AUTHENTICATED STREAM GATEWAY WITH ACCESS KEY] ==="
        echo "" | base64 -d > /tmp/stream_server.py
        export CP_ACCESS_KEY="cp_live_333e13edc65421c267ded8a0"
        sed -i "s/__ACCESS_KEY__/cp_live_333e13edc65421c267ded8a0/g" /tmp/stream_server.py
        nohup python3 /tmp/stream_server.py > /tmp/stream.log 2>&1 &
        sleep 2

    - name: Establish Live Tunnel Gateway
      run: |
        echo "Starting Cloudflare tunnel on port 8000..."
        if ! command -v cloudflared >/dev/null 2>&1; then
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
        fi
        nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > /tmp/tunnel.log 2>&1 &
        TUNNEL_URL=""
        for i in $(seq 1 45); do
          sleep 2
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+.trycloudflare.com" /tmp/tunnel.log | head -1 || true)
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            break
          fi
        done

        if [ -z "$TUNNEL_URL" ]; then
          echo "[ERROR] Tunnel failed to acquire public URL. Tunnel log:"
          cat /tmp/tunnel.log
          exit 1
        fi

        echo "### 📱 CloudPhone Platform // Android 16 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🌐 LIVE ACCESS URL: $TUNNEL_URL**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Configuration Item | Value / Credential |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| **Public Access URL** | [$TUNNEL_URL]($TUNNEL_URL) |" >> $GITHUB_STEP_SUMMARY
        echo "| **Deployment Target** | CLOUDPHONE |" >> $GITHUB_STEP_SUMMARY
        echo "| **Android OS** | Android 16 (Cloud Gaming & AFK Edition) |" >> $GITHUB_STEP_SUMMARY
        echo "| **CloudPhone Access Key** | `cp_live_333e13edc65421c267ded8a0` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Admin Email** | `silence@me.com` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Admin Password** | `Admin@123#` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Web Dashboard Port** | 8080 |" >> $GITHUB_STEP_SUMMARY
        echo "| **Stream Bridge Port** | 8000 |" >> $GITHUB_STEP_SUMMARY
        echo "| **Remote ADB Bridge** | 127.0.0.1:5555 |" >> $GITHUB_STEP_SUMMARY

        echo "::notice title=CloudPhone Android 16 is LIVE::$TUNNEL_URL"

        echo "=========================================================="
        echo "       CLOUDPHONE PLATFORM (ANDROID 16) IS LIVE!          "
        echo "=========================================================="
        echo "Public Web URL : $TUNNEL_URL"
        echo "Target Mode    : CLOUDPHONE"
        echo "Android OS     : Android 16"
        echo "Access Key     : cp_live_333e13edc65421c267ded8a0"
        echo "Admin Email    : silence@me.com"
        echo "Admin Password : Admin@123#"
        echo "ADB Port       : 127.0.0.1:5555"
        echo "=========================================================="

    - name: Keep Alive Monitor Loop
      run: |
        echo "CloudPhone instance is actively running for up to 6 hours..."
        echo "Target URL: $TUNNEL_URL"
        for i in {358..1}; do
            sleep 60
        done